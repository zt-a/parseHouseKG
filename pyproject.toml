[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parsehousekg"
version = "0.1.0"
description = "House.kg parser (kupit) - text + image URLs to SQLite"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "pydantic>=2.9.0",
  "python-dateutil>=2.9.0",
  "tenacity>=9.0.0",
  "rich>=13.8.0",
  "tqdm>=4.66.0",
  "html5lib>=1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["parsehousekg*"]
